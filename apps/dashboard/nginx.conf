server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every unknown route returns index.html so the
    # client-side router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressive caching for the hashed asset bundle, none for index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Hide nginx version on errors.
    server_tokens off;
}
