apiVersion: v2
name: liftwork
description: Plug-and-play Kubernetes build and deploy platform
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/P0intMaN/liftwork
sources:
  - https://github.com/P0intMaN/liftwork
keywords:
  - ci-cd
  - deploy
  - kubernetes
  - paas
  - buildkit
maintainers:
  - name: Pratheek
    email: pratheek.builds@gmail.com

dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "20.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
