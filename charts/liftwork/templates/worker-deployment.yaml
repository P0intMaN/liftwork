{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "liftwork.worker.fullname" . }}
  namespace: {{ include "liftwork.namespace" . }}
  labels:
    {{- include "liftwork.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  # Single replica only — see values.yaml comment.
  replicas: {{ .Values.worker.replicaCount }}
  strategy:
    # Recreate prevents two workers from holding the same arq job during
    # rollouts. Brief downtime is preferable to duplicate execution until
    # arq job resumability lands in Phase 7.
    type: Recreate
  selector:
    matchLabels:
      {{- include "liftwork.worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "liftwork.labels" . | nindent 8 }}
        {{- include "liftwork.worker.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.worker.service.metricsPort | quote }}
        prometheus.io/path: /metrics
        checksum/config: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print .Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "liftwork.worker.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: {{ include "liftwork.image" (dict "image" .Values.worker.image "global" .Values.global "chartVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.worker.service.metricsPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "liftwork.config.fullname" . }}
            - secretRef:
                name: {{ include "liftwork.secretName" . }}
          env:
            - name: LIFTWORK_K8S__IN_CLUSTER
              value: "true"
            - name: LIFTWORK_WORKER__EXECUTOR
              value: {{ .Values.worker.executor | quote }}
            - name: LIFTWORK_WORKER__CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
            - name: LIFTWORK_WORKER__BUILDER_NAMESPACE
              value: {{ .Values.worker.builderNamespace | default (include "liftwork.namespace" .) | quote }}
            - name: LIFTWORK_WORKER__BUILDER_SERVICE_ACCOUNT
              value: {{ .Values.worker.builderServiceAccount | quote }}
            - name: LIFTWORK_WORKER__HEALTH_PORT
              value: {{ .Values.worker.service.metricsPort | quote }}
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
