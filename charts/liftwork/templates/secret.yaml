{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.secrets.jwtSecret -}}
{{ fail "secrets.jwtSecret is required (>= 32 bytes). Either set it via --set or point at an externally-managed Secret with secrets.existingSecret." }}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "liftwork.secret.fullname" . }}
  namespace: {{ include "liftwork.namespace" . }}
  labels:
    {{- include "liftwork.labels" . | nindent 4 }}
type: Opaque
stringData:
  LIFTWORK_JWT__SECRET: {{ .Values.secrets.jwtSecret | quote }}
  LIFTWORK_DATABASE__URL: {{ include "liftwork.databaseUrl" . | quote }}
  LIFTWORK_REDIS__URL: {{ include "liftwork.redisUrl" . | quote }}
  {{- if .Values.secrets.githubWebhookSecret }}
  LIFTWORK_GITHUB__WEBHOOK_SECRET: {{ .Values.secrets.githubWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.bootstrapAdminPassword }}
  LIFTWORK_BOOTSTRAP__ADMIN_EMAIL: {{ .Values.secrets.bootstrapAdminEmail | quote }}
  LIFTWORK_BOOTSTRAP__ADMIN_PASSWORD: {{ .Values.secrets.bootstrapAdminPassword | quote }}
  {{- end }}
{{- end }}
