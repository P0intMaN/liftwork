{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "liftwork.migrate.fullname" . }}-{{ .Release.Revision }}
  namespace: {{ include "liftwork.namespace" . }}
  labels:
    {{- include "liftwork.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Run *before* any Pod sees a new schema. delete-policy=before-hook-creation
    # ensures a clean re-run on retried installs; hook-succeeded keeps the Job
    # around briefly for inspection if migrations failed (replaced when
    # before-hook-creation fires next time).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "liftwork.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "liftwork.api.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "liftwork.image" (dict "image" .Values.api.image "global" .Values.global "chartVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: {{ include "liftwork.config.fullname" . }}
            - secretRef:
                name: {{ include "liftwork.secretName" . }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
{{- end }}
