apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "liftwork.config.fullname" . }}
  namespace: {{ include "liftwork.namespace" . }}
  labels:
    {{- include "liftwork.labels" . | nindent 4 }}
data:
  # Non-secret env vars consumed via envFrom in api + worker pods.
  LIFTWORK_ENV: prod
  LIFTWORK_LOG_LEVEL: INFO
  LIFTWORK_USE_JSON_LOGS: {{ eq .Values.telemetry.logFormat "json" | quote }}
  LIFTWORK_API__HOST: 0.0.0.0
  LIFTWORK_API__PORT: {{ .Values.api.service.port | quote }}
  {{- if .Values.registry.host }}
  LIFTWORK_REGISTRY__HOST: {{ .Values.registry.host | quote }}
  LIFTWORK_REGISTRY__INSECURE: {{ .Values.registry.insecure | quote }}
  {{- end }}
  {{- if .Values.telemetry.otlp.endpoint }}
  LIFTWORK_TELEMETRY__OTEL_ENABLED: "true"
  LIFTWORK_TELEMETRY__OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.telemetry.otlp.endpoint | quote }}
  LIFTWORK_TELEMETRY__OTEL_SERVICE_NAME: liftwork
  {{- else }}
  LIFTWORK_TELEMETRY__OTEL_ENABLED: "false"
  {{- end }}
  LIFTWORK_TELEMETRY__PROMETHEUS_PATH: /metrics
